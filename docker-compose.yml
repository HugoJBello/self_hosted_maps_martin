services:
  martin:
    image: ghcr.io/maplibre/martin:latest
    container_name: martin
    restart: unless-stopped
    command: ["--config", "/etc/martin/config.yaml"]
    volumes:
      - ./data:/data:ro
      - ./martin/config.yaml:/etc/martin/config.yaml:ro
    ports:
      - "43000:3000"

  map-viewer:
    build:
      context: ./viewer
    container_name: map-viewer
    restart: unless-stopped
    environment:
      PORT: "8080"
      MARTIN_BASE_INTERNAL: "http://martin:3000/mapas/tiles"
      MAP_SESSION_TTL_SECONDS: "3600"
      MAP_SESSION_MAX_BYTES: "5mb"
    ports:
      - "48081:8080"
